# Swedish electricity generation mix — technology shares by scenario and year.
#
# !! FLAGGED FOR REVIEW !!
# Default values below are based on Energimyndigheten's long-term energy scenarios
# (Långsiktiga energiscenarier, 2023 edition) and historical Eurostat/SCB data.
# Verify and update against the most recent Energimyndigheten publication before
# using results in published work.
#
# Source references:
#   Historical (2015–2023): Eurostat nrg_cb_pem / SCB EN0105
#   Projections: Energimyndigheten ER 2023:XX (Långsiktiga energiscenarier)
#   Cross-check: ENTSO-E TYNDP 2024 — SE node
#
# Structure:
#   scenarios:
#     <scenario_name>:
#       description: ...
#       years:
#         <year>:
#           <technology>: <share>   # share of total generation (must sum to ~1.0)
#
# Technology keys must match those in technology_activities below.
# Shares represent fraction of total electricity generation (TWh basis).
# Transmission/distribution losses are handled separately in ecoinvent.

# ── Technology → ecoinvent 3.10 activity mapping ──────────────────────────────
# !! VERIFY activity names against ecoinvent 3.10 before building !!
# Use check_activity_names() in build.py to confirm.
# Location preference: SE > RER > GLO (use most specific available).

technology_activities:
  hydro:
    name: "electricity production, hydro, reservoir, alpine region"
    location: "SE"
    fallback_location: "RER"
    notes: "Dominant Swedish source (~45%). SE-specific activity exists in eiv 3.10 — verify."

  nuclear:
    name: "electricity production, nuclear, pressure water reactor"
    location: "SE"
    fallback_location: "RER"
    notes: "~30% share. Sweden operates Forsmark, Ringhals, Oskarshamn. SE activity may exist."

  wind_onshore:
    name: "electricity production, wind, 1-3MW turbine, onshore"
    location: "SE"
    fallback_location: "RER"
    notes: "Rapidly growing. Check for SE-specific activity; otherwise RER."

  wind_offshore:
    name: "electricity production, wind, 1-3MW turbine, offshore"
    location: "RER"
    fallback_location: "GLO"
    notes: "Limited currently but large pipeline. RER likely closest available."

  solar_pv:
    name: "electricity production, photovoltaic, 3kWp slanted-roof installation, multi-Si, panel, mounted"
    location: "RER"
    fallback_location: "GLO"
    notes: "Small but growing. RER or GLO; no SE-specific activity expected."

  biomass_chp:
    name: "heat and power co-generation, wood chips, 6667 kW, state-of-the-art 2014"
    location: "SE"
    fallback_location: "RER"
    notes: "Bioenergy CHP common in Sweden. Verify SE activity exists in eiv 3.10."

  waste_chp:
    name: "heat and power co-generation, waste plastic, municipal"
    location: "RER"
    fallback_location: "GLO"
    notes: "Waste incineration with electricity recovery. Minor share."

  natural_gas:
    name: "electricity production, natural gas, combined cycle power plant"
    location: "RER"
    fallback_location: "GLO"
    notes: "Very minor in Sweden; mainly peaking. Include for completeness."

  net_imports:
    name: "market for electricity, high voltage"
    location: "SE"
    fallback_location: "RER"
    notes: >
      Net import share. Sweden is typically a net exporter but imports from
      Norway (hydro) and Denmark (wind) in low-hydro years. Using SE high-voltage
      market as proxy — this is a simplification. REVIEW for scenarios with
      significant net import shares.

