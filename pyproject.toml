[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "se-electricity-lca"
version = "0.2.0"
description = "Sweden-specific prospective electricity LCA — full LCI reconstruction from technology mix"
requires-python = ">=3.11"
dependencies = [
    "bw2data",
    "bw2calc",
    "pyyaml",
    "pyarrow",
    "pandas",
    "openpyxl",
    "platformdirs",
    "certifi",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["ipython", "jupyter"]

[tool.setuptools.packages.find]
where = ["."]
include = ["se_electricity_lca*"]

[tool.setuptools.package-data]
se_electricity_lca = ["config/*.yaml"]
